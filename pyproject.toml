[build-system]
build-backend = 'mesonpy'
requires = ['meson-python>=0.15']

[project]
name = 'vapoursynth-vfrtocfr'
dynamic = ['version']
description = 'VFRToCFR plugin for VapourSynth (API 4): converts VFR to CFR with Matroska v2 timecodes'
readme = 'README.rst'
requires-python = '>=3.8'
license = { file = 'LICENSE' }
dependencies = ['VapourSynth']

[tool.meson-python.args]
setup = ['-Dpython_package=true']

[tool.meson-python.wheel]
exclude = ['*/*.dll.a', '*/*.lib']
